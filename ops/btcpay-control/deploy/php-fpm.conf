[global]
pid = /run/btcpay-control/php-fpm.pid
error_log = /var/lib/btcpay-control/php-fpm.log
daemonize = no

[btcpay_control]
user = btcpay-control
group = btcpay-control
listen = /run/btcpay-control/php-fpm.sock
listen.owner = nobody
listen.group = nobody
listen.mode = 0600
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 200
request_terminate_timeout = 35s
clear_env = yes
security.limit_extensions = .php
php_admin_value[open_basedir] = /opt/btcpay-control:/var/lib/btcpay-control:/tmp
php_admin_value[session.save_path] = /var/lib/btcpay-control/sessions
php_admin_value[upload_tmp_dir] = /var/lib/btcpay-control
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/lib/btcpay-control/php-errors.log
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 30
php_admin_flag[allow_url_fopen] = off
php_admin_flag[file_uploads] = off
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen
