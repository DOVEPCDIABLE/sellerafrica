# Separate browser origin, without sharing the marketplace PHP handler.
Listen 8443 https
<VirtualHost 68.178.175.236:8443 68.178.160.200:8443>
    ServerName sellerafrica.com
    SSLEngine on
    SSLCertificateFile /var/cpanel/ssl/apache_tls/sellerafrica.com/combined
    SSLCertificateKeyFile /var/cpanel/ssl/apache_tls/sellerafrica.com/combined
    ProxyPreserveHost On
    ProxyPass "/root-terminal/" "http://127.0.0.1:8766/root-terminal/" upgrade=websocket timeout=320
    ProxyPassReverse "/root-terminal/" "http://127.0.0.1:8766/root-terminal/"
    <Location "/root-terminal/">
        RequestHeader set X-BTCPay-Client-IP "expr=%{REMOTE_ADDR}"
    </Location>
    <LocationMatch "^/(?!root-terminal/)">
        Require all denied
    </LocationMatch>
</VirtualHost>
